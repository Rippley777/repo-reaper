services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reaper
      POSTGRES_DB: reaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reaper -d reaper"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reaper:${POSTGRES_PASSWORD}@db:5432/reaper
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reaper:${POSTGRES_PASSWORD}@db:5432/reaper
    command: ["python", "manage.py", "scanworker"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 3m
    restart: unless-stopped
volumes:
  postgres:
