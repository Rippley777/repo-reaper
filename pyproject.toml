[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: real Chromium UI integration tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["reaper/migrations", ".venv", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
format_css = true
format_js = true
